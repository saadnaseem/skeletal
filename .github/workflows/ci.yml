name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:pages
      - name: Browser tests against site/ served with the Cloudflare Pages headers (CSP etc.)
        run: |
          python scripts/serve_site.py 8799 &
          sleep 1
          SKELETAL_URL=http://localhost:8799/ npm run test:e2e
