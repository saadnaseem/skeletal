# Workers Builds runs `npm run build:pages`, then `npx wrangler deploy`.
# This file publishes the static site only. The accounts database lives in
# wrangler.local.toml so a placeholder id is never sent on deploy.
# Sign-in stays hidden until that database exists (docs/DEPLOY.md).
name = "lone-pair"
compatibility_date = "2026-09-01"

[assets]
directory = "./site"
